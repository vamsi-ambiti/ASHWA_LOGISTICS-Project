<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwa Logistics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="/static/js/app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #0a0a0a;
  color: #fff;
}

/* HEADER */
header {
  background: #fff;
  color: #000;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: bold;
  color: #ff6a00;
  
}

.top-links {
  display: flex;
  align-items: center;
  gap: 25px;
}

.top-links a {
  text-decoration: none;
  color: #333;
}

/* LOGIN / PROFILE */
.login-btn {
  padding: 6px 14px;
  background: #1a73e8;
  color: #fff !important;
  border-radius: 20px;
  text-decoration: none;
}

.profile-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid #ff2e63;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: #fff;
}

#profileBox {
  display: none;
  position: absolute;
  top: 70px;
  right: 40px;
  background: #fff;
  color: #000;
  padding: 20px;
  border-radius: 12px;
  width: 260px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  z-index: 100;
}

#profileBox p {
  font-size: 14px;
  margin: 6px 0;
}

.logout-btn {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  border: none;
  background: #ff2e63;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
}

/* SECTION */
.contact-section {
  min-height: 90vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px;
  background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #ff2e63);
  background-size: 300% 300%;
  animation: bgMove 8s infinite alternate;
}

@keyframes bgMove {
  0% { background-position: left; }
  100% { background-position: right; }
}

/* CARD */
.contact-card {
  width: 100%;
  max-width: 1200px;
  background: #000;
  padding: 50px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 70px;
  border-radius: 10px;
  animation: slideUp 1s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(60px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* FORM */
.contact-form input,
.contact-form textarea {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 2px solid #fff;
  color: #fff;
  padding: 16px;
  margin-bottom: 25px;
  outline: none;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder {
  color: #aaa;
}

.contact-form textarea {
  height: 130px;
  resize: none;
}

.contact-form button {
  padding: 12px 30px;
  background: #ff2e63;
  border: none;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

.contact-form button:hover {
  background: #e63950;
  transform: scale(1.03);
}

/* RIGHT SIDE */
.contact-info h1 {
  color: #ff2e63;
  margin: 20px 0;
}

.contact-info a {
  color: #ff2e63;
  text-decoration: none;
}

.phone-link {
  cursor: pointer;
  text-decoration: underline;
}

/* SOCIAL ICONS */
.social-icons {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.icon {
  width: 32px;
  height: 32px;
  transition: 0.3s;
}

.icon:hover {
  transform: scale(1.2);
}

footer {
  text-align: center;
  padding: 20px;
  color: #aaa;
}

/* MOBILE */
@media(max-width:800px){
  header {
    flex-direction: column;
    gap: 15px;
  }

  .top-links {
    flex-wrap: wrap;
    justify-content: center;
  }

  .contact-card {
    grid-template-columns: 1fr;
    padding: 30px;
  }
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.site-logo {
  width: 45px;
  height: 45px;
  border-radius: 50%;        /* makes it circle */
  object-fit: cover;         /* fills the circle */
  object-position: center;   /* center the image */
  border: 2px solid #ff2e63; /* optional stylish border */
  background: #fff;          /* fallback if image has transparency */
}

/* =========================================================
   PREMIUM CONTACT PAGE
   CSS ONLY
   ========================================================= */

body {

/* =========================================================
   ASHWA CONTACT — MOBILE PREMIUM UI
   ========================================================= */

html {
    scroll-behavior: smooth;
}

body {
    overflow-x: hidden;
}

.contact-section {
    min-height: calc(100dvh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px 18px;
}

.contact-card {
    width: 100%;
    animation: contactIn .7s cubic-bezier(.16,1,.3,1) both;
}

.contact-form input,
.contact-form textarea {
    width: 100%;

    font-size: 16px;

        transform .25s ease;
}

.contact-form textarea {
    min-height: 120px;
    resize: vertical;
}

.contact-form input:focus,
.contact-form textarea:focus {
    transform: translateY(-1px);
}

.contact-form button {
    min-height: 50px;
    width: 100%;
    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.contact-form button:active {
    transform: scale(.98);
}

.icon {
    transition:
        transform .25s cubic-bezier(.2,.8,.2,1),
        background .25s ease,
        color .25s ease;

.icon:hover {
    transform: translateY(-4px) scale(1.04);
}

@media (max-width: 800px) {

        padding: 10px 14px;
    }

    .top-links {
        gap: 8px;
    }

    .top-links a {

    }

@media (max-width: 380px) {

    }

    .top-links a {
        font-size: 10px;
    }

    .contact-card {

    }
}

@keyframes contactIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (prefers-reduced-motion: reduce) {

    .contact-card {
        animation: none;
    }
}
/* =========================================================
   STEP 17 — FINAL PUBLIC UI/UX POLISH
   ========================================================= */

html {
  scroll-behavior: smooth;
}

button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}

/* Better keyboard accessibility */
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid #ff6a00;
  outline-offset: 3px;
}

/* Smooth image rendering */
img {
  max-width: 100%;
  height: auto;
}

/* Premium selection */
::selection {
  background: rgba(255,106,0,.20);
  color: inherit;
}

/* Prevent accidental horizontal scrolling */
body {
  overflow-x: hidden;
}

/* Smooth interaction for clickable elements */
a,
button {
  transition:
    transform .2s ease,
    opacity .2s ease,
    box-shadow .2s ease,
    background-color .2s ease;
}

/* Button press feedback */
button:active,
.btn:active,
.login-btn:active,
.search-btn:active {
  transform: scale(.98);
}

/* Mobile touch optimization */
@media (max-width: 700px) {

  button,
  .btn,
  .login-btn,
  .search-btn,
  a {
    touch-action: manipulation;
  }

  input,
  textarea,
  select {
    font-size: 16px;
  }
}

/* Small phones */
@media (max-width: 420px) {

  header {
    padding-left: 16px;
    padding-right: 16px;
  }

  .logo,
  .site-logo {
    max-width: 70%;
  }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* =========================================================
   STEP 18 — PREMIUM HEADER & NAVIGATION UX
   ========================================================= */

/* Premium header */
header {
  position: relative;
  z-index: 100;
  transition:
    box-shadow .3s ease,
    background-color .3s ease;
}

/* Logo */
.logo,
.site-logo {
  transition:
    transform .25s ease,
    opacity .25s ease;
}

.logo:hover,
.site-logo:hover {
  transform: translateY(-1px);
}

/* Navigation links */
.top-links {
  transition: opacity .25s ease;
}

.top-links a {
  position: relative;
  padding: 6px 2px;
}

/* Animated underline */
.top-links a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 2px;
  border-radius: 10px;
  background: currentColor;
  transition: width .25s ease;
}

.top-links a:hover::after {
  width: 100%;
}

/* Login button */
.login-btn {
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    filter .25s ease;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
  filter: brightness(1.03);
}

/* Profile button */
.profile-btn {
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.profile-btn:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 7px 18px rgba(0,0,0,.14);
}

/* Logout button */
.logout-btn {
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.logout-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0,0,0,.12);
}

/* Profile popup */
#profileBox {
  animation: profileBoxIn .25s cubic-bezier(.22,1,.36,1);
  transform-origin: top right;
}

/* Popup animation */
@keyframes profileBoxIn {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(.96);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Tablet */
@media (max-width: 900px) {

  header {
    padding: 14px 24px;
  }

  .top-links {
    gap: 16px;
  }

  .top-links a {
    font-size: 14px;
  }
}

/* Mobile */
@media (max-width: 700px) {

  header {
    padding: 12px 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 18px;
  }

  .top-links {
    width: 100%;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    padding-top: 4px;
  }

  .top-links a {
    font-size: 13px;
  }

  .login-btn {
    padding: 9px 14px;
    font-size: 13px;
  }

  .profile-btn {
    width: 36px;
    height: 36px;
  }

  #profileBox {
    right: 10px;
    max-width: calc(100vw - 20px);
  }
}

/* Small phones */
@media (max-width: 420px) {

  header {
    justify-content: center;
  }

  .logo {
    width: 100%;
    text-align: center;
  }

  .top-links {
    gap: 10px;
  }

  .top-links a {
    font-size: 12px;
  }

  .login-btn {
    padding: 8px 12px;
  }

  .profile-btn {
    width: 34px;
    height: 34px;
  }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {

  .logo,
  .site-logo,
  .top-links,
  .top-links a,
  .login-btn,
  .profile-btn,
  .logout-btn,
  #profileBox {
    transition: none !important;
    animation: none !important;
  }

  .top-links a::after {
    transition: none !important;
  }
}
/* =========================================================
   STEP 20 — CARDS + FORMS PREMIUM UX
   ========================================================= */

/* Cards */
.card,
.issue-card,
.contact-card {
  transition:
    transform .3s cubic-bezier(.22,1,.36,1),
    box-shadow .3s ease,
    border-color .3s ease;
}

.card:hover,
.issue-card:hover,
.contact-card:hover {
  transform: translateY(-4px);
  box-shadow:
    0 20px 45px rgba(0,0,0,.12);
}

/* Form labels */
label {
  transition: color .2s ease;
}

.field:focus-within label,
.form-group:focus-within label {
  color: #ff6a00;
}

/* Inputs */
input,
textarea,
select {
  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    background-color .25s ease,
    transform .2s ease;
}

input:hover,
textarea:hover,
select:hover {
  border-color: rgba(255,106,0,.45);
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  transform: translateY(-1px);
  box-shadow:
    0 0 0 4px rgba(255,106,0,.10);
}

/* Textarea */
textarea {
  resize: vertical;
  min-height: 120px;
}

/* Submit buttons */
button[type="submit"] {
  position: relative;
  overflow: hidden;
}

button[type="submit"]::after {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 70%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );
  transform: skewX(-20deg);
  transition: left .6s ease;
}

button[type="submit"]:hover::after {
  left: 140%;
}

/* Enquiry issue cards */
.issue-card {
  animation: cardAppear .6s cubic-bezier(.22,1,.36,1) both;
}

/* Contact information */
.contact-info a {
  transition:
    color .2s ease,
    transform .2s ease;
}

.contact-info a:hover {
  transform: translateX(3px);
}

/* Social icons */
.social-icons .icon {
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.social-icons .icon:hover {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 10px 22px rgba(0,0,0,.15);
}

/* Card entrance */
@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Tablet */
@media (max-width: 800px) {

  .contact-card {
    gap: 35px;
  }

  .issue-card,
  .contact-card {
    padding: 28px 22px;
  }
}

/* Mobile */
@media (max-width: 600px) {

  .card,
  .issue-card,
  .contact-card {
    border-radius: 18px;
  }

  .card:hover,
  .issue-card:hover,
  .contact-card:hover {
    transform: translateY(-2px);
  }

  input,
  textarea,
  select {
    width: 100%;
    font-size: 16px;
  }

  button[type="submit"] {
    width: 100%;
    min-height: 48px;
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {

  .card,
  .issue-card,
  .contact-card,
  .social-icons .icon {
    animation: none !important;
    transition: none !important;
  }

  button[type="submit"]::after {
    display: none;
  }
}

/* =========================================================
   STEP 21 — FINAL MOBILE-FIRST RESPONSIVE PASS
   ========================================================= */

  }

/* ---------- TOUCH DEVICES ---------- */

@media (hover: none) and (pointer: coarse) {

  .card:hover,

<script>
window.onload = async () => {
  await renderAuth();
};

document.getElementById('contactForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.style.color = '#3b82f6';
  msg.innerText = 'Sending message...';
  try {
    const res = await apiPost('/api/contact/', {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      message: document.getElementById('messageBox').value.trim()
    });
    msg.style.color = '#10b981';
    msg.innerText = res.message || 'Message submitted successfully!';
    document.getElementById('messageBox').value = '';
  } catch(err) {
    msg.style.color = '#ef4444';
    msg.innerText = err.message;
  }
});

function openContactOptions() {
  const phone = '919392564151';
  const choice = confirm('OK = Call\nCancel = SMS');
  window.location.href = (choice ? 'tel:+' : 'sms:+') + phone;
}

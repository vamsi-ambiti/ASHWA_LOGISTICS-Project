
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashwa Logistics Sign Up</title>

    <!-- Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: "Poppins", sans-serif; 
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Background Video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3); 
            backdrop-filter: blur(1px);
            z-index: -2;
        }

        /* Signup Box */
        section {
            position: relative;
            width: 400px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 20px;
            padding: 2rem 3rem;
            backdrop-filter: blur(0px);
            background: rgba(255,255,255,0.12);
            z-index: 10;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        .inputbox {
            position: relative;
            margin: 25px 0;
            width: 100%;
            border-bottom: 2px solid #fff;
        }

        .inputbox label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            color: #fff;
            pointer-events: none;
            transition: 0.5s;
            text-shadow: 0 0 3px rgba(0,0,0,0.4);
        }

        .inputbox input {
            width: 100%;
            height: 50px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #fff;
            padding: 0 40px 0 5px;
            text-shadow: 0 0 3px rgba(0,0,0,0.4);
        }

        .inputbox ion-icon {
            position: absolute;
            right: 8px;
            top: 15px;
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        input:focus ~ label,
        input:valid ~ label {
            top: -8px;
        }

        button {
            width: 100%;
            height: 45px;
            border-radius: 40px;
            border: none;
            background: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: rgba(255,255,255,0.7);
        }

        .link {
            text-align: center;
            margin-top: 15px;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }

        .link a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="/static/background/video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- SIGNUP FORM -->
    <section>
        <form onsubmit="event.preventDefault(); signUp();">
            <h1>Create Account</h1>

            <div class="inputbox">
                <ion-icon name="person-outline"></ion-icon>
                <input type="text" id="fullname" required />
                <label>Full Name</label>
            </div>

            <div class="inputbox">
                <ion-icon name="mail-outline"></ion-icon>
                <input type="email" id="email" required />
                <label>Email</label>
            </div>

            <div class="inputbox">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" id="password" required />
                <label>Password</label>
            </div>

            <div class="inputbox">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" id="confirmPassword" required />
                <label>Confirm Password</label>
            </div>

            <button type="submit">Sign Up</button>

            <div class="link">
                <p>Already have an account? <a href="/login/">Login</a></p>
            </div>
        </form>
    </section>

    <script src="/static/js/app.js"></script>
<script>
async function signUp() {
  const name = document.getElementById('fullname').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (!name || !email || !password || !confirmPassword) return alert('Please fill all fields!');
  if (password.length < 6) return alert('Password must be at least 6 characters long.');
  if (password !== confirmPassword) return alert('Passwords do not match!');
  try {
    const data = await apiPost('/api/signup/', {name, email, password});
    if (data.user) {
      localStorage.setItem('user', JSON.stringify(data.user));
    }
    alert('Account created successfully! Welcome to Ashwa Logistics.');
    window.location.href = '/';
  } catch (err) { alert(err.message); }
}
</script>

</body>
</html>

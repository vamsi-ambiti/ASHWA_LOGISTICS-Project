<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwa Logistics — Customer Issue Report</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="/static/js/app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #0a0a0a;
  color: #fff;
}

header {
  background: #fff;
  color: #000;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: #ff6a00;
}

.top-links {
  display: flex;
  align-items: center;
  gap: 25px;
}

.top-links a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

.login-btn {
  padding: 6px 14px;
  background: #1a73e8;
  color: #fff !important;
  border-radius: 20px;
}
.profile-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid #ff2e63;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: #fff;
}

#profileBox {
  display: none;
  position: absolute;
  top: 70px;
  right: 40px;
  background: #fff;
  color: #000;
  padding: 20px;
  border-radius: 12px;
  width: 260px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  z-index: 100;
}

.logout-btn {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  border: none;
  background: #ff2e63;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
}

.enquiry-section {
  min-height: 85vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
  background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #ff2e63);
  background-size: 300% 300%;
  animation: bgMove 8s infinite alternate;
}

@keyframes bgMove {
  0% { background-position: left; }
  100% { background-position: right; }
}

.issue-card {
  width: 100%;
  max-width: 500px;
  background: #fff;
  color: #000;
  padding: 32px;
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  animation: slideUp 1s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(60px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.issue-card h2 {
  text-align: center;
  margin-bottom: 10px;
  color: #ff2e63;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin-bottom: 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
}

input:focus,
textarea:focus {
  border-color: #ff2e63;
  box-shadow: 0 0 8px rgba(255,46,99,0.3);
}

textarea {
  height: 130px;
  resize: none;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #ff2e63;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #e63950;
  transform: scale(1.03);
}

button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

#message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #aaa;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.site-logo {
  width: 45px;
  height: 45px;
  border-radius: 50%;        /* makes it circle */
  object-fit: cover;         /* fills the circle */
  object-position: center;   /* center the image */
  border: 2px solid #ff2e63; /* optional stylish border */
  background: #fff;          /* fallback if image has transparency */
}

/* =========================================================
   PREMIUM ENQUIRY PAGE
   CSS ONLY
   ========================================================= */

body {
    background: #f5f7fb;
    color: #172033;
}

header {
    background: rgba(255,255,255,0.97);
    box-shadow: 0 4px 20px rgba(20,30,50,0.06);
    border-bottom: 1px solid #edf0f4;
}

.logo {
    color: #e85d04;
    font-weight: 800;
}

.top-links a {
    color: #273247;
    font-weight: 600;
}

.top-links a:hover {
    color: #e85d04;
}

.enquiry-section {
    background:
        radial-gradient(circle at top left, rgba(232,93,4,0.15), transparent 35%),
        linear-gradient(135deg, #101828, #172033);
    padding: 70px 20px;
}

.issue-card {
    max-width: 560px;
    padding: 38px;
    border-radius: 22px;
    background: rgba(255,255,255,0.98);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 25px 70px rgba(0,0,0,0.20);
}

.issue-card h2 {
    color: #e85d04;
    font-weight: 800;
}

.subtitle {
    color: #667085;
}

.issue-card label {
    color: #344054;
    font-weight: 600;
}

.issue-card input,
.issue-card textarea {
    border: 1px solid #dce2eb;
    border-radius: 11px;
    background: #fff;
    color: #172033;
    transition: 0.25s ease;
}

.issue-card input:focus,
.issue-card textarea:focus {
    border-color: #e85d04;
    box-shadow: 0 0 0 4px rgba(232,93,4,0.10);
    outline: none;
}

.issue-card button {
    background: linear-gradient(135deg, #e85d04, #ff8c42);
    border: none;
    border-radius: 11px;
    color: #fff;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(232,93,4,0.22);
}

.issue-card button:hover {
    transform: translateY(-2px);
}

.site-logo {
    border-color: #e85d04 !important;
    color: #e85d04 !important;
}

footer {
    background: #101828;
}

/* =========================================================
   ASHWA ENQUIRY — MOBILE PREMIUM UI
   ========================================================= */

html {
    scroll-behavior: smooth;
}

body {
    overflow-x: hidden;
}

.enquiry-section {
    min-height: calc(100dvh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 18px;
}

.issue-card {
    width: 100%;
    animation: enquiryIn .7s cubic-bezier(.16,1,.3,1) both;
}

.issue-card input,
.issue-card textarea {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    font-size: 16px;
    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

.issue-card textarea {
    min-height: 120px;
    resize: vertical;
}

.issue-card input:focus,
.issue-card textarea:focus {
    transform: translateY(-1px);
}

.issue-card button {
    width: 100%;
    min-height: 50px;
    position: relative;
    overflow: hidden;
    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.issue-card button:active {
    transform: scale(.98);
}

@media (max-width: 700px) {

    header {
        padding: 10px 14px;
    }

    .top-links {
        gap: 8px;
    }

    .top-links a {
        font-size: 12px;
    }

    .enquiry-section {
        min-height: calc(100dvh - 60px);
        padding: 30px 14px;
    }

    .issue-card {
        padding: 25px 19px;
        border-radius: 20px;
    }

    .issue-card h2 {
        font-size: 1.6rem;
    }

    .subtitle {
        font-size: 13px;
        line-height: 1.6;
    }
}

@media (max-width: 380px) {

    .top-links {
        gap: 5px;
    }

    .top-links a {
        font-size: 10px;
    }

    .issue-card {
        padding: 22px 16px;
    }
}

@keyframes enquiryIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (prefers-reduced-motion: reduce) {

    .issue-card {
        animation: none;
    }
}
/* =========================================================
   STEP 17 — FINAL PUBLIC UI/UX POLISH
   ========================================================= */

html {
  scroll-behavior: smooth;
}

button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}

/* Better keyboard accessibility */
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid #ff6a00;
  outline-offset: 3px;
}

/* Smooth image rendering */
img {
  max-width: 100%;
  height: auto;
}

/* Premium selection */
::selection {
  background: rgba(255,106,0,.20);
  color: inherit;
}

/* Prevent accidental horizontal scrolling */
body {
  overflow-x: hidden;
}

/* Smooth interaction for clickable elements */
a,
button {
  transition:
    transform .2s ease,
    opacity .2s ease,
    box-shadow .2s ease,
    background-color .2s ease;
}

/* Button press feedback */
button:active,
.btn:active,
.login-btn:active,
.search-btn:active {
  transform: scale(.98);
}

/* Mobile touch optimization */
@media (max-width: 700px) {

  button,
  .btn,
  .login-btn,
  .search-btn,
  a {
    touch-action: manipulation;
  }

  input,
  textarea,
  select {
    font-size: 16px;
  }
}

/* Small phones */
@media (max-width: 420px) {

  header {
    padding-left: 16px;
    padding-right: 16px;
  }

  .logo,
  .site-logo {
    max-width: 70%;
  }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* =========================================================
   STEP 18 — PREMIUM HEADER & NAVIGATION UX
   ========================================================= */

/* Premium header */
header {
  position: relative;
  z-index: 100;
  transition:
    box-shadow .3s ease,
    background-color .3s ease;
}

/* Logo */
.logo,
.site-logo {
  transition:
    transform .25s ease,
    opacity .25s ease;
}

.logo:hover,
.site-logo:hover {
  transform: translateY(-1px);
}

/* Navigation links */
.top-links {
  transition: opacity .25s ease;
}

.top-links a {
  position: relative;
  padding: 6px 2px;
}

/* Animated underline */
.top-links a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 2px;
  border-radius: 10px;
  background: currentColor;
  transition: width .25s ease;
}

.top-links a:hover::after {
  width: 100%;
}

/* Login button */
.login-btn {
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    filter .25s ease;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
  filter: brightness(1.03);
}

/* Profile button */
.profile-btn {
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.profile-btn:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 7px 18px rgba(0,0,0,.14);
}

/* Logout button */
.logout-btn {
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.logout-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0,0,0,.12);
}

/* Profile popup */
#profileBox {
  animation: profileBoxIn .25s cubic-bezier(.22,1,.36,1);
  transform-origin: top right;
}

/* Popup animation */
@keyframes profileBoxIn {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(.96);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Tablet */
@media (max-width: 900px) {

  header {
    padding: 14px 24px;
  }

  .top-links {
    gap: 16px;
  }

  .top-links a {
    font-size: 14px;
  }
}

/* Mobile */
@media (max-width: 700px) {

  header {
    padding: 12px 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 18px;
  }

  .top-links {
    width: 100%;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    padding-top: 4px;
  }

  .top-links a {
    font-size: 13px;
  }

  .login-btn {
    padding: 9px 14px;
    font-size: 13px;
  }

  .profile-btn {
    width: 36px;
    height: 36px;
  }

  #profileBox {
    right: 10px;
    max-width: calc(100vw - 20px);
  }
}

/* Small phones */
@media (max-width: 420px) {

  header {
    justify-content: center;
  }

  .logo {
    width: 100%;
    text-align: center;
  }

  .top-links {
    gap: 10px;
  }

  .top-links a {
    font-size: 12px;
  }

  .login-btn {
    padding: 8px 12px;
  }

  .profile-btn {
    width: 34px;
    height: 34px;
  }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {

  .logo,
  .site-logo,
  .top-links,
  .top-links a,
  .login-btn,
  .profile-btn,
  .logout-btn,
  #profileBox {
    transition: none !important;
    animation: none !important;
  }

  .top-links a::after {
    transition: none !important;
  }
}
/* =========================================================
   STEP 20 — CARDS + FORMS PREMIUM UX
   ========================================================= */

/* Cards */
.card,
.issue-card,
.contact-card {
  transition:
    transform .3s cubic-bezier(.22,1,.36,1),
    box-shadow .3s ease,
    border-color .3s ease;
}

.card:hover,
.issue-card:hover,
.contact-card:hover {
  transform: translateY(-4px);
  box-shadow:
    0 20px 45px rgba(0,0,0,.12);
}

/* Form labels */
label {
  transition: color .2s ease;
}

.field:focus-within label,
.form-group:focus-within label {
  color: #ff6a00;
}

/* Inputs */
input,
textarea,
select {
  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    background-color .25s ease,
    transform .2s ease;
}

input:hover,
textarea:hover,
select:hover {
  border-color: rgba(255,106,0,.45);
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  transform: translateY(-1px);
  box-shadow:
    0 0 0 4px rgba(255,106,0,.10);
}

/* Textarea */
textarea {
  resize: vertical;
  min-height: 120px;
}

/* Submit buttons */
button[type="submit"] {
  position: relative;
  overflow: hidden;
}

button[type="submit"]::after {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 70%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );
  transform: skewX(-20deg);
  transition: left .6s ease;
}

button[type="submit"]:hover::after {
  left: 140%;
}

/* Enquiry issue cards */
.issue-card {
  animation: cardAppear .6s cubic-bezier(.22,1,.36,1) both;
}

/* Contact information */
.contact-info a {
  transition:
    color .2s ease,
    transform .2s ease;
}

.contact-info a:hover {
  transform: translateX(3px);
}

/* Social icons */
.social-icons .icon {
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.social-icons .icon:hover {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 10px 22px rgba(0,0,0,.15);
}

/* Card entrance */
@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Tablet */
@media (max-width: 800px) {

  .contact-card {
    gap: 35px;
  }

  .issue-card,
  .contact-card {
    padding: 28px 22px;
  }
}

/* Mobile */
@media (max-width: 600px) {

  .card,
  .issue-card,
  .contact-card {
    border-radius: 18px;
  }

  .card:hover,
  .issue-card:hover,
  .contact-card:hover {
    transform: translateY(-2px);
  }

  input,
  textarea,
  select {
    width: 100%;
    font-size: 16px;
  }

  button[type="submit"] {
    width: 100%;
    min-height: 48px;
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {

  .card,
  .issue-card,
  .contact-card,
  .social-icons .icon {
    animation: none !important;
    transition: none !important;
  }

  button[type="submit"]::after {
    display: none;
  }
}

/* =========================================================
   STEP 21 — FINAL MOBILE-FIRST RESPONSIVE PASS
   ========================================================= */

/* ---------- TABLET ---------- */

@media (max-width: 900px) {

  .container,
  .contact-card,
  .issue-card,
  section {
    max-width: 94%;
  }

  .contact-card {
    gap: 35px;
  }

  .bottom-cards {
    gap: 16px;
  }

  .hero-content {
    max-width: 90%;
  }
}


/* ---------- MOBILE ---------- */

@media (max-width: 700px) {

  /* General spacing */
  section {
    width: calc(100% - 28px);
  }

  /* Header */
  header {
    min-height: 60px;
  }

  /* Hero */
  .hero {
    min-height: 600px;
  }

  .hero-content {
    width: 100%;
    max-width: 100%;
  }

  /* Columns become one column */
  .left-column,
  .right-column {
    width: 100%;
    max-width: 100%;
  }

  /* Form rows */
  .input-row {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .input-row > * {
    width: 100%;
  }

  /* Cards */
  .bottom-cards {
    display: grid;
    grid-template-columns: 1fr;
  }

  /* Enquiry */
  .enquiry-section {
    padding: 35px 14px;
  }

  .issue-card {
    width: 100%;
    max-width: 100%;
  }

  /* Contact */
  .contact-section {
    padding: 35px 14px;
  }

  .contact-card {
    width: 100%;
    max-width: 100%;
    grid-template-columns: 1fr;
  }

  /* Contact form */
  .contact-form {
    width: 100%;
  }

  /* Login / signup */
  body:has(.overlay) {
    padding: 14px;
  }

  body:has(.overlay) section {
    width: 100%;
    max-width: 420px;
  }
}


/* ---------- SMALL PHONES ---------- */

@media (max-width: 480px) {

  /* Header */
  header {
    padding: 12px 14px;
  }

  /* Typography */
  h1 {
    font-size: 26px;
  }

  h2 {
    font-size: 22px;
  }

  h3 {
    font-size: 18px;
  }

  /* Hero */
  .hero {
    min-height: 560px;
  }

  .hero-content {
    padding: 20px 12px;
  }

  .hero-content h1 {
    font-size: 27px;
  }

  .hero-content p {
    font-size: 13px;
    line-height: 1.6;
  }

  /* Buttons */
  .hero-buttons {
    width: 100%;
  }

  .hero-buttons .btn,
  .hero-buttons .secondary-btn {
    width: 100%;
  }

  /* Cards */
  .card,
  .issue-card,
  .contact-card {
    padding: 22px 18px;
  }

  /* Form */
  .field {
    width: 100%;
  }

  input,
  textarea,
  select {
    width: 100%;
  }

  /* Login */
  body:has(.overlay) section {
    padding: 26px 20px;
    border-radius: 18px;
  }

  body:has(.overlay) h1 {
    font-size: 25px;
  }

  /* Enquiry */
  .issue-card h2 {
    font-size: 22px;
  }

  /* Contact */
  .contact-info h1 {
    font-size: 25px;
  }

  .social-icons {
    gap: 10px;
    flex-wrap: wrap;
  }
}


/* ---------- VERY SMALL PHONES ---------- */

@media (max-width: 360px) {

  header {
    padding: 10px 12px;
  }

  .top-links {
    gap: 8px;
  }

  .hero-content h1 {
    font-size: 24px;
  }

  .hero-content p {
    font-size: 12px;
  }

  .card,
  .issue-card,
  .contact-card {
    padding: 18px 14px;
  }

  body:has(.overlay) {
    padding: 10px;
  }

  body:has(.overlay) section {
    padding: 22px 16px;
  }
}


/* ---------- TOUCH DEVICES ---------- */

@media (hover: none) and (pointer: coarse) {

  .card:hover,
  .issue-card:hover,
  .contact-card:hover,
  #trackingMapCard:hover {
    transform: none;
  }

  .top-links a:hover::after {
    width: 0;
  }

  button:hover,
  .btn:hover,
  .login-btn:hover,
  .search-btn:hover {
    transform: none;
  }

  input,
  textarea,
  select,
  button {
    min-height: 46px;
  }
}


/* ---------- ACCESSIBILITY ---------- */

@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<header>
 <div class="logo">
  <img src="/static/background/logo.jpeg" class="site-logo">
  Ashwa Logistics
</div>
  <div class="top-links">
    <a href="/">Home</a>
    <a href="/enquiry/">Enquiry</a>
    <a href="/contact/">Contact</a>
    <div id="authArea" style="position:relative;"></div>
  </div>
</header>

<div id="profileBox">
  <h3>👤 My Profile</h3>
  <p id="pName"></p>
  <p id="pEmail"></p>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<section class="enquiry-section">
  <div class="issue-card">
    <h2>Customer Issue Report</h2>
    <p class="subtitle">Submit your issue directly</p>

    <form id="issueForm">
      <label>User Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label>User Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label>Issue / Comment</label>
      <textarea id="comment" placeholder="Type your product here and comment issue ..." required></textarea>

      <button type="submit" id="submitBtn">Send Issue</button>
      <p id="message"></p>
    </form>
  </div>
</section>

<footer>
  © 2025 Ashwa Logistics
</footer>


<script src="/static/js/app.js"></script>
<script>
window.onload = async () => {
  await renderAuth();
};

const form = document.getElementById('issueForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async function(event) {
  event.preventDefault();
  submitBtn.disabled = true;
  submitBtn.innerText = 'Sending...';
  message.style.color = '#3b82f6';
  message.innerText = 'Submitting issue report...';

  try {
    const res = await apiPost('/api/enquiries/', {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      comment: document.getElementById('comment').value.trim()
    });
    message.style.color = '#10b981';
    message.innerText = res.message || 'Issue sent successfully!';
    document.getElementById('comment').value = '';
  } catch (err) {
    message.style.color = '#ef4444';
    message.innerText = err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = 'Send Issue';
  }
});
</script>

</body>
</html>

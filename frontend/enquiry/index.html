<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwa Logistics — Customer Issue Report</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #0a0a0a;
  color: #fff;
}

header {
  background: #fff;
  color: #000;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: #ff6a00;
}

.top-links {
  display: flex;
  align-items: center;
  gap: 25px;
}

.top-links a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

.login-btn {
  padding: 6px 14px;
  background: #1a73e8;
  color: #fff !important;
  border-radius: 20px;
}
.profile-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid #ff2e63;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: #fff;
}

#profileBox {
  display: none;
  position: absolute;
  top: 70px;
  right: 40px;
  background: #fff;
  color: #000;
  padding: 20px;
  border-radius: 12px;
  width: 260px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  z-index: 100;
}

.logout-btn {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  border: none;
  background: #ff2e63;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
}

.enquiry-section {
  min-height: 85vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
  background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #ff2e63);
  background-size: 300% 300%;
  animation: bgMove 8s infinite alternate;
}

@keyframes bgMove {
  0% { background-position: left; }
  100% { background-position: right; }
}

.issue-card {
  width: 100%;
  max-width: 500px;
  background: #fff;
  color: #000;
  padding: 32px;
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  animation: slideUp 1s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(60px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.issue-card h2 {
  text-align: center;
  margin-bottom: 10px;
  color: #ff2e63;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin-bottom: 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
}

input:focus,
textarea:focus {
  border-color: #ff2e63;
  box-shadow: 0 0 8px rgba(255,46,99,0.3);
}

textarea {
  height: 130px;
  resize: none;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #ff2e63;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #e63950;
  transform: scale(1.03);
}

button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

#message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #aaa;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.site-logo {
  width: 45px;
  height: 45px;
  border-radius: 50%;        /* makes it circle */
  object-fit: cover;         /* fills the circle */
  object-position: center;   /* center the image */
  border: 2px solid #ff2e63; /* optional stylish border */
  background: #fff;          /* fallback if image has transparency */
}
</style>
</head>

<body>

<header>
 <div class="logo">
  <img src="/static/background/logo.jpeg" class="site-logo">
  Ashwa Logistics
</div>
  <div class="top-links">
    <a href="/">Home</a>
    <a href="/enquiry/">Enquiry</a>
    <a href="/contact/">Contact</a>
    <div id="authArea" style="position:relative;"></div>
  </div>
</header>

<div id="profileBox">
  <h3>👤 My Profile</h3>
  <p id="pName"></p>
  <p id="pEmail"></p>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<section class="enquiry-section">
  <div class="issue-card">
    <h2>Customer Issue Report</h2>
    <p class="subtitle">Submit your issue directly</p>

    <form id="issueForm">
      <label>User Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label>User Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label>Issue / Comment</label>
      <textarea id="comment" placeholder="Type your product here and comment issue ..." required></textarea>

      <button type="submit" id="submitBtn">Send Issue</button>
      <p id="message"></p>
    </form>
  </div>
</section>

<footer>
  © 2025 Ashwa Logistics
</footer>


<script src="/static/js/app.js"></script>
<script>
window.onload = async () => {
  await renderAuth();
};

const form = document.getElementById('issueForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async function(event) {
  event.preventDefault();
  submitBtn.disabled = true;
  submitBtn.innerText = 'Sending...';
  message.style.color = '#3b82f6';
  message.innerText = 'Submitting issue report...';

  try {
    const res = await apiPost('/api/enquiries/', {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      comment: document.getElementById('comment').value.trim()
    });
    message.style.color = '#10b981';
    message.innerText = res.message || 'Issue sent successfully!';
    document.getElementById('comment').value = '';
  } catch (err) {
    message.style.color = '#ef4444';
    message.innerText = err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = 'Send Issue';
  }
});
</script>

</body>
</html>

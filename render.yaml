services:
  - type: web
    name: ashwa-logistics-web
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_render_admin && gunicorn --chdir backend ashwa.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ashwa-logistics-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,http://127.0.0.1:5500,http://localhost:5500
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: ashwa-logistics-postgres
    databaseName: ashwa_logistics
    region: singapore
    plan: free
    ipAllowList: []

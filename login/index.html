    <title>Ashwa Logistics Login</title>

    <!-- Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: "Poppins", sans-serif; 
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Background Video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
        }

        /* Softer Overlay */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3); 
            backdrop-filter: blur(1px);
            z-index: -2;
        }

        /* Login Box (Reduced blur) */
        section {
            position: relative;
            width: 400px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 20px;
            padding: 2rem 3rem;
            backdrop-filter: blur(0px);
            background: rgba(255,255,255,0.12);
            z-index: 10;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        .inputbox {
            position: relative;
            margin: 30px 0;
            width: 100%;
            border-bottom: 2px solid #fff;
        }

        .inputbox label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            color: #fff;
            pointer-events: none;
            transition: 0.5s;
            text-shadow: 0 0 3px rgba(0,0,0,0.4);
        }

        .inputbox input {
            width: 100%;
            height: 50px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #fff;
            padding: 0 40px 0 5px;
            text-shadow: 0 0 3px rgba(0,0,0,0.4);
        }

        .inputbox ion-icon {
            position: absolute;
            right: 8px;
            top: 15px;
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        input:focus ~ label,
        input:valid ~ label {
            top: -8px;
        }

        .forget {
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }

        .forget a {
            color: #fff;
            font-weight: bold;
            text-decoration: none;
        }

        button {
            width: 100%;
            height: 45px;
            border-radius: 40px;
            border: none;
            background: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: rgba(255,255,255,0.7);
        }

        .register {
            text-align: center;
            margin-top: 15px;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }

        .register a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

/* =========================================================
   ASHWA LOGIN — MOBILE UX + PREMIUM ANIMATION
   ========================================================= */

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
}

/* Glass login panel */
section {
    animation: loginPanelIn .75s cubic-bezier(.16,1,.3,1) both;
    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.12);
}

/* Input animation */
.inputbox {
    transition:
        border-color .3s ease,
        transform .3s ease;
}

.inputbox:focus-within {
    transform: translateY(-2px);
}

.inputbox input {
    transition: color .25s ease;
}

/* Button UX */
button {
    min-height: 48px;
    position: relative;
    overflow: hidden;
    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

button::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    transform: skewX(-20deg);
    transition: left .6s ease;
}

button:hover::after {
    left: 130%;
}

button:active {
    transform: scale(.97);
}

/* Links */
.forget a,
.register a {
    transition:
        color .2s ease,
        opacity .2s ease;
}

.forget a:hover,
.register a:hover {
    color: #ff8a3d;
    opacity: .85;
}

/* Mobile */
@media (max-width: 600px) {

    body {
        padding: 16px;
    }

    section {
        width: 100%;
        max-width: 430px;
        padding: 28px 22px;
        border-radius: 22px;
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
    }

    .inputbox {
        margin: 25px 0;
    }

    .inputbox input {
        height: 48px;
        font-size: 16px;
    }

    .forget {
        gap: 12px;
        font-size: 13px;
    }

    button {
        min-height: 50px;
        font-size: 15px;
    }

    .register {
        font-size: 13px;
    }
}

@media (max-width: 360px) {

    body {
        padding: 10px;
    }

    section {
        padding: 24px 18px;
        border-radius: 18px;
    }

    h1 {
        font-size: 1.6rem;
    }

    .inputbox {
        margin: 22px 0;
    }
}

/* Animation */
@keyframes loginPanelIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (prefers-reduced-motion: reduce) {

    section,
    button,
    .inputbox {
        animation: none !important;
        transition: none !important;
    }
}

/* =========================================================
   STEP 17 — FINAL PUBLIC UI/UX POLISH
   ========================================================= */

html {
  scroll-behavior: smooth;
}

button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}

/* Better keyboard accessibility */
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid #ff6a00;
  outline-offset: 3px;
}

/* Smooth image rendering */
img {
  max-width: 100%;
  height: auto;
}

/* Premium selection */
::selection {
  background: rgba(255,106,0,.20);
  color: inherit;
}

/* Prevent accidental horizontal scrolling */
body {
  overflow-x: hidden;
}

/* Smooth interaction for clickable elements */
a,
button {
  transition:
    transform .2s ease,
    opacity .2s ease,
    box-shadow .2s ease,
    background-color .2s ease;
}

/* Button press feedback */
button:active,
.btn:active,
.login-btn:active,
.search-btn:active {
  transform: scale(.98);
}

/* Mobile touch optimization */
@media (max-width: 700px) {

  button,
  .btn,
  .login-btn,
  .search-btn,
  a {
    touch-action: manipulation;
  }

  input,
  textarea,
  select {
    font-size: 16px;
  }
}

/* Small phones */
@media (max-width: 420px) {

  header {
    padding-left: 16px;
    padding-right: 16px;
  }

  .logo,
  .site-logo {
    max-width: 70%;
  }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

<body>

    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="/static/background/video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- LOGIN FORM -->
    <section>
        <form id="loginForm">
            <h1>Login</h1>

            <div class="inputbox">
                <ion-icon name="mail-outline"></ion-icon>
                <input type="email" id="email" required />
                <label>Email</label>
            </div>

            <div class="inputbox">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" id="password" required />
                <label>Password</label>
            </div>

            <div class="forget">
                <label><input type="checkbox"> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn">Login</button>

            <div class="register">
                <p>Don't have an account? <a href="/signup/">Signup</a></p>
            </div>
        </form>
    </section>

    <script src="/static/js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !password) {
    alert('Please enter both email and password.');
    return;
  }

  btn.disabled = true;
  btn.innerText = 'Logging in...';

  try {
    const data = await apiPost('/api/login/', {email, password});
    if (data && data.user) {
      localStorage.setItem('user', JSON.stringify(data.user));
    }
    if (data && data.token) {
      localStorage.setItem('token', data.token);
    }
    
    // Smooth transition to next page
    if (data && data.user && data.user.is_staff) {
      window.location.href = '/admin/dashboard/';
    } else {
      window.location.href = '/';
    }
  } catch (err) {
    alert(err.message || 'Login failed. Please check your credentials.');
    btn.disabled = false;
    btn.innerText = 'Login';
  }
});
</script>
